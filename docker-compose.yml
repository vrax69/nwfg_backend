version: '3.8'

services:
  # Base Services
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    ports:
      - "9092:9092"
      - "9644:9644"
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    networks:
      - nwfg-network
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    networks:
      - nwfg-network
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    depends_on:
      redpanda:
        condition: service_healthy

  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    networks:
      - nwfg-network
    restart: always

  # Database
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: nwfg_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    volumes:
      - ./infrastructure/mysql:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    networks:
      - nwfg-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  # Application Services
  rates-service:
    build:
      context: ./services/rates-service # <--- Apuntando a la carpeta PRO que sí existe
      dockerfile: Dockerfile
    container_name: rates-service
    ports:
      - "4002:4002"
    env_file:
      - ./env/rates.env # <--- Usando tu archivo de variables específico
    environment:
      - KAFKA_BROKER=redpanda:9092
    depends_on:
      mysql:
        condition: service_healthy
      redpanda:
        condition: service_healthy # Añadido para evitar errores de conexión al arranque
    networks:
      - nwfg-network
    volumes:
      - ./services/rates-service/src:/app/src
      - ./services/rates-service/package.json:/app/package.json

  users-service:
    build:
      context: ./services/users-service
      dockerfile: Dockerfile
    container_name: users-service
    ports:
      - "4001:4001"
    env_file:
      - ./env/users.env
    environment:
      - NODE_ENV=development
      - PORT=4001
      - DB_HOST=mysql
    depends_on:
      mysql:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - nwfg-network
    volumes:
      - ./services/users-service/src:/app/src
      - ./services/users-service/package.json:/app/package.json

  graphql-gateway:
    build:
      context: ./services/graphql-gateway
      dockerfile: Dockerfile
    container_name: graphql-gateway
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - USERS_SERVICE_URL=http://users-service:4001/graphql
      - RATES_SERVICE_URL=http://rates-service:4002/graphql
      - JWT_SECRET=NwfgMasterSecret2025!!
      # - SCRIPTS_SERVICE_URL=http://scripts-service:4006/graphql 
    depends_on:
      users-service:
        condition: service_started
      rates-service:
        condition: service_started
      redpanda:
        condition: service_healthy
    networks:
      - nwfg-network
    volumes:
      - ./services/graphql-gateway/server.js:/app/server.js
      - ./services/graphql-gateway/package.json:/app/package.json

networks:
  nwfg-network:
    driver: bridge

volumes:
  mysql_data:
