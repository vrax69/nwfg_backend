version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    networks:
      - nwfg-network
    restart: always

  # Database
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: nwfg_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    volumes:
      - ./infrastructure/mysql:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    networks:
      - nwfg-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  # Application Services
  rates-service:
    build:
      context: ./services/rates-service # <--- Apuntando a la carpeta PRO que sí existe
      dockerfile: Dockerfile
    container_name: rates-service
    ports:
      - "4002:4002"
    env_file:
      - ./env/rates.env # <--- Usando tu archivo de variables específico
    environment:
      - KAFKA_BROKER=redpanda:9092 # Removing this dependency
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nwfg-network
    volumes:
      - ./services/rates-service/src:/app/src
      - ./services/rates-service/package.json:/app/package.json

  users-service:
    build:
      context: ./services/users-service
      dockerfile: Dockerfile
    container_name: users-service
    ports:
      - "4001:4001"
    env_file:
      - ./env/users.env
    environment:
      - NODE_ENV=development
      - PORT=4001
      - DB_HOST=mysql
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nwfg-network
    volumes:
      - ./services/users-service/src:/app/src
      - ./services/users-service/package.json:/app/package.json

  graphql-gateway:
    build:
      context: ./services/graphql-gateway
      dockerfile: Dockerfile
    container_name: graphql-gateway
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - USERS_SERVICE_URL=http://users-service:4001/graphql
      - RATES_SERVICE_URL=http://rates-service:4002/graphql
      - JWT_SECRET=NwfgMasterSecret2025!!
      # - SCRIPTS_SERVICE_URL=http://scripts-service:4006/graphql 
    depends_on:
      users-service:
        condition: service_started
      rates-service:
        condition: service_started
    networks:
      - nwfg-network
    volumes:
      - ./services/graphql-gateway/server.js:/app/server.js
      - ./services/graphql-gateway/package.json:/app/package.json

  upload-service:
    build:
      context: ./services/upload-service
      dockerfile: Dockerfile
    container_name: upload-service
    ports:
      - "4005:4005"
    env_file:
      - ./env/upload.env
    depends_on:
      redis:
        condition: service_started
      rates-service:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - nwfg-network
    volumes:
      - ./services/upload-service/src:/app/src
      - ./services/upload-service/index.js:/app/index.js
      - ./services/upload-service/package.json:/app/package.json

networks:
  nwfg-network:
    driver: bridge

volumes:
  mysql_data:
